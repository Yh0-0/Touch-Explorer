  function pad(n) { return String(n).padStart(6, '0'); }
  function frameURL(i) { return `${DIR}/MVI_${pad(BASE + i)}.jpg`; }

  // ── STRETCH PHASE (KIVIK stretch-horizontal) ────────────────────
  function runStretchPhase() {
    const SDIR  = 'Kivik_stretch_horizontal';
    const STPL  = 'kivik_stretch_horizontal';
    const SS = 13, SE = 50, STOTAL = SE - SS;

    idleHandle.style.transition   = 'opacity 0.4s';
    idleHandle.style.opacity      = '0';
    if (idleHintGroup) { idleHintGroup.style.opacity = '0'; }
    if (idleDragHint)  { idleDragHint.style.transition = 'opacity 0.4s'; idleDragHint.style.opacity = '0'; }
    if (idleMeterEl)   { idleMeterEl.style.transition  = 'opacity 0.4s'; idleMeterEl.style.opacity  = '0'; }

    function sqURL(f) { return `${SDIR}/${STPL}${f}.jpg`; }
    function setHandles(prog) {
      const offset = 28 + prog * 42;
      if (idleSqLeft)  idleSqLeft.style.left  = `calc(50% - ${offset}px)`;
      if (idleSqRight) idleSqRight.style.left = `calc(50% + ${offset}px)`;
      setFingerMorph(prog);
      updateIdleSi(prog);
    }

    crossfadeTo(`${SDIR}/${STPL}${SS}.jpg`, INFO_KIVIK, () => {
      morphPhaseIdx = 0; morphPhaseStart = null;
      setFingerMorph(0);
      setHandles(0);
      if (idleSqLeft)           idleSqLeft.style.opacity           = '1';
      if (idleSqRight)          idleSqRight.style.opacity          = '1';
      if (idleSiZone)         { idleSiZone.style.opacity = '1'; updateIdleSi(0); }
      if (idleStretchHint)      idleStretchHint.style.opacity      = '1';
      if (idleStretchFingerGroup) idleStretchFingerGroup.style.opacity = '0'; // ensure inline value set for hintTick check

      const HINT_DUR = 4400;
      const hintStart = performance.now();
      let hintRaf;
      function hintTick(ts) {
        tickFingerMorph(ts);
        const elapsed = performance.now() - hintStart;
        if (elapsed >= HINT_DUR - 33 && idleStretchFingerGroup && idleStretchFingerGroup.style.opacity === '0') {
          idleStretchFingerGroup.style.opacity = '1';
        }
        if (elapsed >= HINT_DUR) { setHandles(0); setFingerMorph(0); startStretch(); return; }
        const cycleT = (elapsed % 2200) / 2200;
        let prog;
        if (cycleT < 0.25) { prog = 0; }
        else if (cycleT < 0.65) { const t = (cycleT - 0.25) / 0.40; prog = (1 - Math.cos(t * Math.PI)) / 2; }
        else if (cycleT < 0.80) { prog = 1; }
        else { const t = (cycleT - 0.80) / 0.20; prog = (1 + Math.cos(t * Math.PI)) / 2; }
        setHandles(prog * 0.4);
        hintRaf = requestAnimationFrame(hintTick);
      }
      hintRaf = requestAnimationFrame(hintTick);
    });

    function startStretch() {
      if (idleSqLeft)  idleSqLeft.style.opacity  = '0.13';
      if (idleSqRight) idleSqRight.style.opacity = '0.13';
      let frame = SS;
      function stretchOut() {
        idleImg.src = sqURL(frame);
        setHandles((frame - SS) / STOTAL);
        if (frame >= SE) { timer = setTimeout(stretchReturn, 0); return; }
        frame++;
        timer = setTimeout(stretchOut, 1000 / 30);
      }
      function stretchReturn() {
        idleImg.src = sqURL(frame);
        setHandles((frame - SS) / STOTAL);
        if (frame <= SS) { stretchOvershoot(); return; }
        frame--;
        timer = setTimeout(stretchReturn, 1000 / 45);
      }
      function stretchOvershoot() {
        frame = SS;
        function ovIn() {
          idleImg.src = sqURL(frame);
          setHandles((frame - SS) / STOTAL);
          if (frame >= SS + 6) { ovOut(); return; }
          frame++;
          timer = setTimeout(ovIn, 1000 / 30);
        }
        function ovOut() {
          idleImg.src = sqURL(frame);
          setHandles((frame - SS) / STOTAL);
          if (frame <= SS) {
            if (idleSqLeft)             idleSqLeft.style.opacity             = '0';
            if (idleSqRight)            idleSqRight.style.opacity            = '0';
            if (idleStretchFingerGroup) idleStretchFingerGroup.style.opacity = '0';
            if (idleStretchHint)        idleStretchHint.style.opacity        = '0';
            if (idleSiZone)             idleSiZone.style.opacity             = '0';
            setFingerMorph(0); updateIdleSi(0);
            setTimeout(() => {
              crossfadeTo(frameURL(0), INFO_JATTEBO, () => {
                if (idleMeterEl) idleMeterEl.style.opacity = '1';
                timer = setTimeout(runAnimation, 200);
              });
            }, 300);
            return;
          }
          frame--;
          timer = setTimeout(ovOut, 1000 / 20);
        }
        ovIn();
      }
      timer = setTimeout(stretchOut, 300);
    }
  }

  function runAnimation() {
    idleHandle.style.transition  = 'opacity 0.4s';
    idleHandle.style.opacity     = '1';
    if (idleDragHint) { idleDragHint.style.transition = 'opacity 0.4s'; idleDragHint.style.opacity = '1'; }
    idleHandle.style.animation  = '';
    idleHandle.style.transform  = '';
    if (idleHintGroup) {
      idleHintGroup.style.animation  = '';
      idleHintGroup.style.transform  = '';
      idleHintGroup.style.opacity    = '0';
    }
    if (idleDragHint) {
      idleDragHint.style.animation  = '';
      idleDragHint.style.transform  = '';
    }
    idleImg.src = frameURL(0);
    updateMeter(0);

    timer = setTimeout(() => {
      idleHandle.style.opacity   = '0.13';
      idleHandle.style.animation = 'none';
      if (idleDragHint) idleDragHint.style.animation = 'none';
      if (idleHintGroup) {
        idleHintGroup.style.animation = 'none';
        // show one frame before press starts (350ms delay - 33ms)
        setTimeout(() => { idleHintGroup.style.opacity = '1'; }, 317);
      }

      let frame = 0;

      // Phase A: press down 0→25 at 30fps
      function playPress() {
        if (frame > MAX_PRESS) { startSpringBack(); return; }
        idleImg.src = frameURL(frame);
        updateMeter(frame, true);
        frame++;
        timer = setTimeout(playPress, 1000 / PRESS_FPS);
      }

      // Phase B: spring back 25→0 (reverse) at 45fps
      function startSpringBack() {
        frame = MAX_PRESS;
        function playBack() {
          idleImg.src = frameURL(frame);
          updateMeter(frame, true);
          if (frame <= 0) { startOvershoot(); return; }
          frame--;
          timer = setTimeout(playBack, 1000 / 45);
        }
        playBack();
      }

      // Phase C: slight overshoot 0→8 at 30fps, then settle 8→0 at 20fps
      function startOvershoot() {
        frame = 0;
        function overshootIn() {
          idleImg.src = frameURL(frame);
          updateMeter(frame, true);
          if (frame >= 8) { overshootOut(); return; }
          frame++;
          timer = setTimeout(overshootIn, 1000 / 30);
        }
        function overshootOut() {
          idleImg.src = frameURL(frame);
          updateMeter(frame, true);
          if (frame <= 0) {
            updateMeter(0);
            timer = setTimeout(runStretchPhase, 600);
            return;
          }
          frame--;
          timer = setTimeout(overshootOut, 1000 / 20);
        }
        overshootIn();
      }

      timer = setTimeout(playPress, 350);
    }, BOUNCE_MS);
  }

  runAnimation();
})();

})();
</script>
