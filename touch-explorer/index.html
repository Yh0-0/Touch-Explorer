}

// Handle constants — centred symmetrically at 50% either side of panel
const SQ_LEFT_PCT  = 0.332;  // 50% − 16.8%
const SQ_RIGHT_PCT = 0.668;  // 50% + 16.8%


// ── Structure Indicator ────────────────────────────────────────────────────
// Draws a thin zone line centred between the handles.
// Only shown for stretch-h and stretch-v — hidden for squeeze / no gesture.
// Pre-builds the si-zone child elements ONCE so updateStructureIndicator only
// updates style values — never creates/destroys DOM nodes during animation.
function _initSiElements(inst) {
  const zone = inst.siZone;
  if (!zone || inst.siElsH) return; // already done

  const POS   = 'position:absolute;';
  const GRADH = 'background-image:repeating-linear-gradient(to right,transparent 0,transparent 2px,rgba(255,255,255,0.42) 2px,rgba(255,255,255,0.42) 4px);';
  const GRADV = 'background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(255,255,255,0.42) 2px,rgba(255,255,255,0.42) 4px);';
  const TC = 'rgba(255,255,255,0.48)';  // tick default color
  const DOT = POS + 'bottom:-12px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;border:1.5px solid rgba(255,255,255,0.50);background:transparent;';

  function mk(css) { const d = document.createElement('div'); d.style.cssText = css; return d; }

  // ── H set (shown during stretch-h) ──────────────────────────────────────────
  const hWrap = mk(POS + 'inset:0;display:none;');
  inst.siElHFill  = mk(POS + 'height:100%;background:rgba(255,255,255,0.88);border-radius:1px;display:none;');
  inst.siElHDash1 = mk(POS + 'left:0;height:100%;' + GRADH + 'display:none;');
  inst.siElHDash2 = mk(POS + 'right:0;height:100%;' + GRADH + 'display:none;');
  inst.siElHTick1 = mk(POS + 'left:0;top:50%;transform:translateY(-50%);width:1.5px;height:10px;background:' + TC + ';border-radius:1px;');
  inst.siElHTick2 = mk(POS + 'right:0;top:50%;transform:translateY(-50%);width:1.5px;height:10px;background:' + TC + ';border-radius:1px;');
  inst.siElHDot   = mk(DOT);
  hWrap.append(inst.siElHFill, inst.siElHDash1, inst.siElHDash2, inst.siElHTick1, inst.siElHTick2, inst.siElHDot);
  inst.siElsH = hWrap;

  // ── V set (shown during stretch-v) ──────────────────────────────────────────
  const vWrap = mk(POS + 'inset:0;display:none;');
  inst.siElVFill  = mk(POS + 'width:100%;background:rgba(255,255,255,0.88);border-radius:1px;display:none;');
  inst.siElVDash1 = mk(POS + 'top:0;width:100%;' + GRADV + 'display:none;');
  inst.siElVDash2 = mk(POS + 'bottom:0;width:100%;' + GRADV + 'display:none;');
  inst.siElVTick1 = mk(POS + 'top:0;left:50%;transform:translateX(-50%);height:1.5px;width:10px;background:' + TC + ';border-radius:1px;');
  inst.siElVTick2 = mk(POS + 'bottom:0;left:50%;transform:translateX(-50%);height:1.5px;width:10px;background:' + TC + ';border-radius:1px;');
  inst.siElVDot   = mk(DOT);
  vWrap.append(inst.siElVFill, inst.siElVDash1, inst.siElVDash2, inst.siElVTick1, inst.siElVTick2, inst.siElVDot);
  inst.siElsV = vWrap;

  zone.append(hWrap, vWrap);

  // Per-frame caches — avoids redundant style writes
  inst._siLastIsV    = null;   // last orientation ('h'/'v')
  inst._siLastMaxLen = -1;     // last indicator max length
  inst._siLastBot    = -1;     // last bottom px value
  inst._siLastAtMax  = null;   // last atMax boolean
  inst._siBottom     = null;   // cached indicatorBottomPx()
}

// Returns how many px above the panel's bottom edge to anchor the indicator,
// placing it exactly 25px above the top of the info-name text.
function indicatorBottomPx(inst) {
  const nameEl = inst.panel.querySelector('.info-name');
  if (!nameEl) return 80; // fallback
  const pr = inst.panel.getBoundingClientRect();
  const nr = nameEl.getBoundingClientRect();
  return Math.round(pr.bottom - nr.top) + 25;
}
// Cache helpers — call on addPanel and resize so getBCR is never in the hot path.
function recacheIndicatorBottom(inst) {
  if (!inst || !inst.siZone) return;
  inst._siBottom     = indicatorBottomPx(inst);
  inst._siLastBot    = -1;  // force zone cssText rewrite on next update
}
function recacheAllIndicatorBottoms() { panels.forEach(recacheIndicatorBottom); }

// update-only: children are pre-built by _initSiElements; no DOM creation here.
function updateStructureIndicator(inst, gestureType, depth, transMs) {
  const zone = inst.siZone;
  if (!zone || !inst.siElsH) return;  // not yet initialised

  if (!gestureType || gestureType === 'squeeze') {
    zone.style.opacity = '0';
    return;
  }

  const family = familyById(inst.familyId);
  const sc  = structureCfg(family, inst.colorKey);
  const cfg = sc.structureIndicator || family.structureIndicator || {};

  const isV    = (gestureType === 'stretch-v');
  const maxLen = isV ? (cfg.maxStretchV || 30) : (cfg.maxStretchH || 30);

  const dep    = Math.max(0, Math.min(1, depth));
  const filled = dep * maxLen;
  const remH   = (maxLen - filled) / 2;
  const atMax  = dep >= 0.98;
  const bot    = inst._siBottom != null ? inst._siBottom : indicatorBottomPx(inst);

  // ── Zone container — only rewrite when orientation / size / position changes ─
  if (inst._siLastIsV !== isV || inst._siLastMaxLen !== maxLen) {
    inst._siLastIsV    = isV;
    inst._siLastMaxLen = maxLen;
    zone.style.cssText = isV
      ? `position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);width:3px;height:${maxLen}px;pointer-events:none;z-index:6;`
      : `position:absolute;left:50%;top:25%;transform:translate(-50%,-50%);height:3px;width:${maxLen}px;pointer-events:none;z-index:6;`;
    inst.siElsH.style.display = isV ? 'none' : 'block';
    inst.siElsV.style.display = isV ? 'block' : 'none';
    inst._siLastAtMax = null;  // force tick/dot refresh after orientation switch
  }
  zone.style.opacity = '1';

  // ── Filled bar ──────────────────────────────────────────────────────────────
  if (filled > 0.5) {
    if (isV) {
      inst.siElVFill.style.top    = remH + 'px';
      inst.siElVFill.style.height = filled + 'px';
      inst.siElVFill.style.display = 'block';
    } else {
      inst.siElHFill.style.left  = remH + 'px';
      inst.siElHFill.style.width = filled + 'px';
      inst.siElHFill.style.display = 'block';
    }
  } else {
    if (isV) inst.siElVFill.style.display = 'none';
    else     inst.siElHFill.style.display = 'none';
  }

  // ── Dashed ends ─────────────────────────────────────────────────────────────
  if (remH > 1) {
    if (isV) {
      inst.siElVDash1.style.height = remH + 'px'; inst.siElVDash1.style.display = 'block';
      inst.siElVDash2.style.height = remH + 'px'; inst.siElVDash2.style.display = 'block';
    } else {
      inst.siElHDash1.style.width  = remH + 'px'; inst.siElHDash1.style.display = 'block';
      inst.siElHDash2.style.width  = remH + 'px'; inst.siElHDash2.style.display = 'block';
    }
  } else {
    if (isV) { inst.siElVDash1.style.display = 'none'; inst.siElVDash2.style.display = 'none'; }
    else     { inst.siElHDash1.style.display = 'none'; inst.siElHDash2.style.display = 'none'; }
  }

  // ── Ticks and dot — only update when atMax flips (avoids repeated string writes) ──
  if (inst._siLastAtMax !== atMax) {
    inst._siLastAtMax = atMax;
    const tickBg = `rgba(255,255,255,${atMax ? 0.85 : 0.48})`;
    const dotBg  = atMax ? 'rgba(255,255,255,0.88)' : 'transparent';
    const dotBd  = atMax ? 'rgba(255,255,255,0.88)' : 'rgba(255,255,255,0.50)';
    const dotSh  = atMax ? '0 0 5px rgba(255,255,255,0.32)' : 'none';
    inst.siElHTick1.style.background = inst.siElHTick2.style.background =
    inst.siElVTick1.style.background = inst.siElVTick2.style.background = tickBg;
    for (const dot of [inst.siElHDot, inst.siElVDot]) {
      dot.style.background  = dotBg;
      dot.style.borderColor = dotBd;
      dot.style.boxShadow   = dotSh;
    }
  }
}

// Update both handle positions for any gesture type at a given depth (0..1)
function updateStructureHandles(inst, gestureType, depth) {
  const w      = inst._videoAreaW || inst.videoArea.getBoundingClientRect().width || inst.videoArea.offsetWidth || inst.panel.offsetWidth || 300;
  if (!inst._videoAreaW && w > 0) inst._videoAreaW = w;
  const fixedL = w * SQ_LEFT_PCT;
  const initR  = w * SQ_RIGHT_PCT;
  // Squeeze travel: how far each handle moves inward (stops 120 px gap minimum)
  const squeezePx = Math.max(0, initR - (fixedL + 120));

  // Per-panel stretch travel — mirrors the indicator bar dimensions (maxLen / 2 per handle)
  const family     = familyById(inst.familyId);
  const sc         = structureCfg(family, inst.colorKey);
  const cfg        = sc.structureIndicator || family.structureIndicator || {};
  const stretchHPx = (cfg.maxStretchH || 30) / 2;  // per-handle travel for stretch-h
  const stretchVPx = (cfg.maxStretchV || 30) / 2;  // per-handle travel for stretch-v

  if (!gestureType || gestureType === 'squeeze') {
    // Both handles move inward symmetrically (each travels half the total squeeze range)
    inst.squeezeHandleL.style.left = (fixedL + depth * squeezePx / 2) + 'px';
    inst.squeezeHandleR.style.left = (initR  - depth * squeezePx / 2) + 'px';
    inst.squeezeHandleL.style.top  = '50%';
    inst.squeezeHandleR.style.top  = '50%';
  } else if (gestureType === 'stretch-h') {
    const cx = w / 2;
    inst.squeezeHandleL.style.left = (cx - depth * stretchHPx) + 'px';
    inst.squeezeHandleR.style.left = (cx + depth * stretchHPx) + 'px';
    inst.squeezeHandleL.style.top  = '50%';
    inst.squeezeHandleR.style.top  = '50%';
  } else { // stretch-v
    const centerX = w / 2;
    inst.squeezeHandleL.style.left = centerX + 'px';
    inst.squeezeHandleR.style.left = centerX + 'px';
    inst.squeezeHandleL.style.top  = `calc(50% + ${depth * stretchVPx}px)`;
    inst.squeezeHandleR.style.top  = `calc(50% - ${depth * stretchVPx}px)`;
  }

  // Rotate arrow icons to match gesture direction:
  //   squeeze (inward H) → 0°  | stretch-h (outward H) → 180°  | stretch-v (V) → 90°
  const rot = gestureType === 'stretch-h' ? 180 : gestureType === 'stretch-v' ? 90 : 0;
  const lSvg = inst.squeezeHandleLSvg || inst.squeezeHandleL.querySelector('svg');
  const rSvg = inst.squeezeHandleRSvg || inst.squeezeHandleR.querySelector('svg');
  if (lSvg) lSvg.style.transform = `rotate(${rot}deg)`;
  if (rSvg) rSvg.style.transform = `rotate(${rot}deg)`;
}

function renderStructure(inst, gestureType, depth) {
  updateStructureHandles(inst, gestureType, depth);
  updateStructureIndicator(inst, gestureType, depth, 0); // 0 = instant (gesture / spring-back)
  const family = familyById(inst.familyId);
  const sc = structureCfg(family, inst.colorKey);

  // Per-colour render config (structureByColor entry) takes priority over family-level,
  // which in turn falls back to generic defaults.
  // Schema: { scale, origin, xStart, xEnd }
  //   xStart/xEnd — object-position X% at depth=0 and depth=1
  const sr = sc.structureRender || family.structureRender || {
    squeeze:  { scale: 1.25, origin: 'top right', xStart: 65, xEnd: 50 },
    stretchH: { scale: 1.00, origin: 'center',    xStart: 50, xEnd: 50 },
    stretchV: { scale: 1.00, origin: 'center',    xStart: 50, xEnd: 50 },
  };

  function applyRenderCfg(cfg) {
    const xPct = cfg.xStart + depth * (cfg.xEnd - cfg.xStart);
    inst.squeezeImg.style.transform       = `scale(${cfg.scale})`;
    inst.squeezeImg.style.transformOrigin = cfg.origin;
    inst.squeezeImg.style.objectPosition  = `${xPct}% center`;
  }

  if (!gestureType || gestureType === 'squeeze') {
    // Hand variant resting state: show frame 00 of the hand sequence (or blank if no footage)
    if (!gestureType && state.structureVariant === 'hand') {
      const hc = handVariantCfg(family, inst.colorKey);
      if (hc.stretchHandFramesDir && inst.hasStretchHandFrames) {
        applyRenderCfg(sr.stretchH);
        const f0 = hc.stretchHandStartFrame || 0;
        if (inst.stretchHandFrames[f0]) {
          inst.squeezeImg.src = inst.stretchHandFrames[f0].src;
          inst.squeezeImg.style.display = 'block';
        }
      } else {
        inst.squeezeImg.style.display = 'none'; // no hand footage for this color → blank
      }
      return;
    }
    applyRenderCfg(sr.squeeze);
    if (!inst.hasSqueezeFrames || !sc.squeezeFramesDir) return;
    const startF   = sc.squeezeStartFrame || 0;
    const frameIdx = startF + Math.round(depth * (sc.squeezeEndFrame - startF));
    if (inst.squeezeFrames[frameIdx]) {
      inst.squeezeImg.src = inst.squeezeFrames[frameIdx].src;
      inst.squeezeImg.style.display = 'block';
    }
  } else if (gestureType === 'stretch-h') {
    applyRenderCfg(sr.stretchH);
    // Hand variant: use stretchHandFrames instead of the default stretchHFrames
    if (state.structureVariant === 'hand') {
      const hc = handVariantCfg(family, inst.colorKey);
      if (hc.stretchHandFramesDir && inst.hasStretchHandFrames) {
        const startF   = hc.stretchHandStartFrame || 0;
        const frameIdx = startF + Math.round(depth * ((hc.stretchHandEndFrame || 31) - startF));
        if (inst.stretchHandFrames[frameIdx]) {
          inst.squeezeImg.src = inst.stretchHandFrames[frameIdx].src;
          inst.squeezeImg.style.display = 'block';
        }
      } else {
        inst.squeezeImg.style.display = 'none'; // no hand footage for this color → blank
      }
      return;
    }
    if (!inst.hasStretchHFrames || !sc.stretchHFramesDir) return;
    const startF   = sc.stretchHStartFrame || 0;
    const frameIdx = startF + Math.round(depth * (sc.stretchHEndFrame - startF));
    if (inst.stretchHFrames[frameIdx]) {
      inst.squeezeImg.src = inst.stretchHFrames[frameIdx].src;
      inst.squeezeImg.style.display = 'block';
    }
  } else { // stretch-v
    applyRenderCfg(sr.stretchV);
    if (!inst.hasStretchVFrames || !sc.stretchVFramesDir) return;
    const startF   = sc.stretchVStartFrame || 0;
    const frameIdx = startF + Math.round(depth * (sc.stretchVEndFrame - startF));
    if (inst.stretchVFrames[frameIdx]) {
      inst.squeezeImg.src = inst.stretchVFrames[frameIdx].src;
      inst.squeezeImg.style.display = 'block';
    }
  }
}

// Returns the structureIndicator config object for a panel instance.
function getInstIndicatorCfg(inst) {
  if (!inst) return {};
  const family = familyById(inst.familyId);
  const sc     = structureCfg(family, inst.colorKey);
  return sc.structureIndicator || family.structureIndicator || {};
}

function renderAllStructure(gestureType, depth) {
  depth = Math.max(0, Math.min(1, depth));
  state.gestureDepth = depth;
  state.gestureType  = gestureType;

  // Per-panel depth normalisation (follows Pressing logic):
  // The triggered panel's indicator max sets the drag cap. Panels with a LARGER max
  // haven't reached their visual limit yet at the same depth — showing relative elasticity.
  // Formula: panelDepth = min(1, depth × triggeredMax / panelMax)
  const triggered  = state.triggeredPanelInst;
  const isStretch  = (gestureType === 'stretch-h' || gestureType === 'stretch-v');
  const isV        = (gestureType === 'stretch-v');

  let triggeredMax = null;
  if (isStretch && triggered) {
    const tCfg  = getInstIndicatorCfg(triggered);
    triggeredMax = isV ? (tCfg.maxStretchV || 30) : (tCfg.maxStretchH || 30);
  }

  panels.forEach(inst => {
    let d = depth;
    if (triggeredMax !== null && inst !== triggered) {
      const pCfg = getInstIndicatorCfg(inst);
      const pMax = isV ? (pCfg.maxStretchV || 30) : (pCfg.maxStretchH || 30);
      d = Math.min(1, depth * triggeredMax / pMax);
    }
    renderStructure(inst, gestureType, d);
  });
}

// ============================================================
// STRUCTURE HINT ANIMATION  (three-gesture demo loop)
// ============================================================
//
// Three-phase loop: H-stretch → Squeeze → V-stretch → repeat
//
// Named handle positions (per-panel, driven by structureIndicator config):
//   h-ep    — stretch-h depth=1 endpoints (fixedL - sHPx, initR + sHPx), top 50%
//   h-out   — h-ep + 20px further outward, top 50%
//   h-sq-in — h-out + 30px inward (= h-ep + 10px inward), top 50%
//   v-ep    — stretch-v depth=1 endpoints: left 50%, top 50% ± sVPx
//   v-out   — v-ep + 20px further from centre: left 50%, top 50% ± (sVPx+20)
//
// Cycle (~7.4 s, one wiggle per phase — mirrors press interaction feel):
//   H-stretch:  at h-ep (indicator endpoints); wiggle outward 10px; hold at extreme ~300ms; return; hold ~600ms
//   Squeeze:    indicator off; wiggle inward 10px from h-ep; hold at extreme ~300ms; return; hold ~600ms
//   V-stretch:  indicator on; transition to v-ep; wiggle outward 10px; hold ~300ms; return; hold ~600ms
//   → transition back to h-ep and repeat

let hintRunning = false;
let hintTimers  = [];   // all pending hint setTimeout IDs

// Hint animation timing constants  (modelled after press indicator: 2.2 s / 14 px)
const HINT_WIGGLE_MS  = 650;  // each move direction (similar feel to press's ~880ms for 14px)
const HINT_EXT_HOLD   = 300;  // brief hold at extreme before returning (≈ press's 330ms hold at bottom)
const HINT_EP_HOLD    = 600;  // hold at endpoint before switching phase
const HINT_TRANS_MS   = 400;  // cross-gesture transition (h-ep ↔ v-ep)
const HINT_OUT_PX     = 30;   // outward wiggle for stretch phases
const HINT_SQ_OUTER   = 100;  // squeeze hint home: 100px outside each indicator endpoint
const HINT_SQ_IN_PX   = 30;   // how far sq-out wiggles inward
const HINT_EP_OFFSET  = 30;   // stretch hint home offset beyond indicator endpoint (edge clears line)

function stopStructureHintAnim() {
  hintRunning = false;
  hintTimers.forEach(id => clearTimeout(id));
  hintTimers = [];
  panels.forEach(p => {
    if (p.squeezeHandleL) p.squeezeHandleL.style.transition = '';
    if (p.squeezeHandleR) p.squeezeHandleR.style.transition = '';
  });
}

// Move all panel handles to a named position with a CSS transition.
// stateKey: 'h-ep' | 'h-out' | 'sq-out' | 'sq-in' | 'v-ep' | 'v-out'
//
//   h-ep   — HINT_EP_OFFSET px outside H indicator endpoint, rot=180 (stretch arrows, outward)
//   h-out  — h-ep + HINT_OUT_PX further outward                     (H-stretch wiggle extreme)
//   sq-out — HINT_SQ_OUTER px outside H indicator endpoint, rot=0   (squeeze hint home, inward arrows)
//   sq-in  — sq-out − HINT_SQ_IN_PX inward                          (squeeze wiggle extreme)
//   v-ep   — HINT_EP_OFFSET px outside V indicator endpoint, rot=90  (left ↓, right ↑)
//   v-out  — v-ep + HINT_OUT_PX further from centre                  (V-stretch wiggle extreme)
function moveHintHandles(stateKey, transMs) {
  const easing = 'cubic-bezier(0.4, 0, 0.2, 1)';
  panels.forEach(p => {
    if (!p.squeezeHandleL || !p.squeezeHandleR) return;
    const L = p.squeezeHandleL, R = p.squeezeHandleR;
    const tr = transMs > 0 ? `left ${transMs}ms ${easing}, top ${transMs}ms ${easing}` : '';
    L.style.transition = tr;
    R.style.transition = tr;

    const w    = p._videoAreaW || p.videoArea.getBoundingClientRect().width || p.videoArea.offsetWidth || p.panel.offsetWidth || 300;
    if (!p._videoAreaW && w > 0) p._videoAreaW = w;
    const cx   = w / 2;   // panel centre X

    // All panels use JÄTTEBO indicator values for uniform hint positions
    // JÄTTEBO: maxStretchH=30 → sHPx=15,  maxStretchV=48 → sVPx=24
    const sHPx   = 15;
    const sVPx   = 24;
    const hBase  = sHPx + HINT_EP_OFFSET;   // 15 + 30 = 45
    const vBase  = sVPx + HINT_EP_OFFSET;   // 24 + 30 = 54
    const sqBase = sHPx + HINT_SQ_OUTER;    // 15 + 100 = 115

    let lLeft, rLeft, lTop, rTop, rot;

    if (stateKey === 'h-ep') {
      lLeft = cx - hBase;  rLeft = cx + hBase;
      lTop  = '50%';       rTop  = '50%';
      rot   = 180;
    } else if (stateKey === 'h-out') {
      lLeft = cx - hBase - HINT_OUT_PX;  rLeft = cx + hBase + HINT_OUT_PX;
      lTop  = '50%';                      rTop  = '50%';
      rot   = 180;
    } else if (stateKey === 'sq-out') {
      lLeft = cx - sqBase;  rLeft = cx + sqBase;
      lTop  = '50%';        rTop  = '50%';
      rot   = 0;
    } else if (stateKey === 'sq-in') {
      lLeft = cx - (sqBase - HINT_SQ_IN_PX);  rLeft = cx + (sqBase - HINT_SQ_IN_PX);
      lTop  = '50%';                            rTop  = '50%';
      rot   = 0;
    } else if (stateKey === 'v-ep') {
      lLeft = '50%';  rLeft = '50%';
      lTop  = `calc(50% + ${vBase}px)`;
      rTop  = `calc(50% - ${vBase}px)`;
      rot   = 90;
    } else if (stateKey === 'v-out') {
      lLeft = '50%';  rLeft = '50%';
      lTop  = `calc(50% + ${vBase + HINT_OUT_PX}px)`;
      rTop  = `calc(50% - ${vBase + HINT_OUT_PX}px)`;
      rot   = 90;
    }

    L.style.left = typeof lLeft === 'number' ? lLeft + 'px' : lLeft;
    R.style.left = typeof rLeft === 'number' ? rLeft + 'px' : rLeft;
    L.style.top  = lTop;
    R.style.top  = rTop;

    const lSvg = p.squeezeHandleLSvg || L.querySelector('svg');
    const rSvg = p.squeezeHandleRSvg || R.querySelector('svg');
    if (lSvg) lSvg.style.transform = `rotate(${rot}deg)`;
    if (rSvg) rSvg.style.transform = `rotate(${rot}deg)`;
  });
}

// Show or hide the si-zone indicator for all panels.
// gestureType: 'stretch-h' | 'stretch-v' | 'squeeze' | null → null/squeeze hides it
function setHintIndicator(gestureType) {
  panels.forEach(p => {
    if (!p.siZone) return;
    if (!gestureType || gestureType === 'squeeze') {
      p.siZone.style.opacity = '0';
    } else {
      // depth=0 → dashed/hollow state (no fill) — hint animation shows the range, not a filled bar
      updateStructureIndicator(p, gestureType, 0, 0);
    }
  });
}

// Instantly flip all handle arrows to a given rotation without moving their position.
function setHintArrows(rot) {
  const t = `rotate(${rot}deg)`;
  panels.forEach(p => {
    if (p.squeezeHandleLSvg) p.squeezeHandleLSvg.style.transform = t;
    if (p.squeezeHandleRSvg) p.squeezeHandleRSvg.style.transform = t;
  });
}

function hintCycle() {
  if (!hintRunning) return;

  const W   = HINT_WIGGLE_MS;  // 650ms per move (similar speed to press indicator)
  const EXT = HINT_EXT_HOLD;   // 300ms hold at wiggle extreme (mirrors press's ~330ms bottom-hold)
  const EP  = HINT_EP_HOLD;    // 600ms pause at endpoint before phase switch
  const TR  = HINT_TRANS_MS;   // 400ms cross-gesture transition

  // Cumulative-delay scheduler — `t` accumulates absolute ms from cycle start
  let t = 0;
  function ht(delay, fn) {
    t += delay;
    hintTimers.push(setTimeout(() => { if (hintRunning) fn(); }, t));
  }

  // ── H-stretch ── handles already at h-ep (outward arrows, indicator visible) ──
  setHintIndicator('stretch-h');
  ht(0,       () => moveHintHandles('h-out', W));   // wiggle out  (arrives at W)
  ht(W + EXT, () => moveHintHandles('h-ep',  W));   // hold EXT at extreme → return to h-ep

  // ── Squeeze ─────────────────────────────────────────────────────────────
  // After H-stretch, handles are at h-ep. Move outward to sq-out (50px from indicator),
  // then wiggle once inward to sq-in, hold, return to sq-out, hold.
  ht(W + EP, () => {                                // hold EP at h-ep → enter squeeze
    setHintIndicator('squeeze');                    // indicator disappears
    moveHintHandles('sq-out', W);                   // move to squeeze home (wider, arrows flip inward)
  });
  ht(W + EXT, () => moveHintHandles('sq-in',  W)); // hold EXT at sq-out → wiggle inward
  ht(W + EXT, () => moveHintHandles('sq-out', W)); // hold EXT at sq-in  → return to sq-out

  // ── V-stretch ────────────────────────────────────────────────────────────
  ht(W + EP, () => {                                // hold EP at ep → switch
    setHintIndicator('stretch-v');
    moveHintHandles('v-ep', TR);                    // cross-gesture transition
  });
  ht(TR,      () => moveHintHandles('v-out', W));   // wiggle out  (arrives at W)
  ht(W + EXT, () => moveHintHandles('v-ep',  W));   // hold EXT at extreme → return

  // ── Back to H-stretch → loop or go static if user has interacted ─────────
  ht(W + EP, () => {
    setHintIndicator('stretch-h');
    moveHintHandles('h-ep', TR);
  });
  ht(TR, () => { variantInteracted() ? showStaticHandles() : hintCycle(); });
  // Cycle timing:
  //   H-stretch: W+EXT+W+EP          = 950+1250 = 2200ms  (t=0..2200)
  //   Squeeze:   W+EXT + W+EXT + W+EP = 950+950+1250=3150ms (t=2200..5350)
  //   V-stretch: TR+W+EXT+W+EP       = 400+950+1250=2600ms (t=5350..7950)
  //   H-ep transition: TR            = 400ms               (t=7950..8350)
  //   Total ≈ 8350ms
}

// Hand variant: H-stretch only hint cycle (no squeeze, no V-stretch).
function hintCycleHand() {
  if (!hintRunning) return;
  const W = HINT_WIGGLE_MS, EXT = HINT_EXT_HOLD, EP = HINT_EP_HOLD;
  let t = 0;
  function ht(delay, fn) {
    t += delay;
    hintTimers.push(setTimeout(() => { if (hintRunning) fn(); }, t));
  }
  // H-stretch: wiggle once out → return → loop or go static if interacted
  setHintIndicator('stretch-h');
  ht(0,       () => moveHintHandles('h-out', W));
  ht(W + EXT, () => moveHintHandles('h-ep',  W));
  ht(W + EP,  () => { variantInteracted() ? showStaticHandles() : hintCycleHand(); });
}

// Places handles at their depth-0 resting positions at 50% opacity with no animation.
// Called after the one-shot hint finishes, or immediately if already interacted/shown.
function showStaticHandles() {
  hintRunning = false;
  panels.forEach(p => {
    if (!p.squeezeHandleL || !p.squeezeHandleR) return;
    p.squeezeHandleL.style.transition = '';
    p.squeezeHandleR.style.transition = '';
    p.squeezeHandleL.style.display = 'none';
    p.squeezeHandleR.style.display = 'none';
    if (p.siZone) p.siZone.style.opacity = '0';
  });
}

// initTransMs: 0 = instant (entering structure mode); ~380 = smooth (after spring-back).
function startStructureHintAnim(initTransMs) {
  initTransMs = initTransMs || 0;
  stopStructureHintAnim();
  if (!panels.length) return;

  // Already interacted with this variant → show static handles, no animation
  if (variantInteracted()) {
    showStaticHandles();
    return;
  }

  hintRunning = true;
  panels.forEach(p => {
    if (p.squeezeHandleL) p.squeezeHandleL.classList.add('demo');
    if (p.squeezeHandleR) p.squeezeHandleR.classList.add('demo');
  });

  if (state.structureVariant === 'hand') {
    setHintIndicator('stretch-h');
    moveHintHandles('h-ep', initTransMs);
    hintTimers.push(setTimeout(() => { if (hintRunning) hintCycleHand(); }, initTransMs));
  } else {
    setHintIndicator('stretch-h');
    moveHintHandles('h-ep', initTransMs);
    hintTimers.push(setTimeout(() => { if (hintRunning) hintCycle(); }, initTransMs));
  }
}

// ============================================================
// METER — 3-zone update (mirrors React reference logic)
// ============================================================
function updateMeter(inst, displayFrameIdx) {
  const family  = familyById(inst.familyId);
  const maxF    = family.maxPressFrame;
  // Dirty check — skip all DOM writes if the frame hasn't changed
  const _thisFrame = Math.min(Math.max(0, displayFrameIdx), maxF);
  if (_thisFrame === inst._lastMeterFrame) return;
  inst._lastMeterFrame = _thisFrame;
  const pd      = family.pressDepth || 5;

  // Physical press track (zones 1+2) = pressDepth × TRACK_SCALE
  const pressTrackPx = pd * TRACK_SCALE;
  // Non-pressable zone (zone 3) = remaining cushion thickness below press depth
  const springPx     = ((family.cushionDepth || 15) - pd) * TRACK_SCALE;

  // thisFrame capped at maxF for visual fill (spring frames don't extend zone 1)
  const thisFrame = Math.min(Math.max(0, displayFrameIdx), maxF);
  const fillPx    = (thisFrame / maxF) * pressTrackPx;
  const bottomed  = thisFrame >= maxF - 0.5;

  // Zone 1 — pressed (solid, 0 → fillPx)
  inst.meterZ1.style.height = Math.max(0, fillPx) + 'px';

  // Zone 2 — remaining pressable (dotted, fillPx → pressTrackPx)
  inst.meterZ2.style.top    = fillPx + 'px';
  inst.meterZ2.style.height = Math.max(0, pressTrackPx - fillPx) + 'px';

  // Zone 3 — spring/bounce zone (pale, pressTrackPx → pressTrackPx + springPx)
  inst.meterZ3.style.top    = pressTrackPx + 'px';
  inst.meterZ3.style.height = Math.max(0, springPx) + 'px';

  // Floor marker sits at the press/spring boundary
  inst.meterFloor.style.top = pressTrackPx + 'px';

  // Handle circle follows fill (hidden at rest)
  inst.meterHandle.style.top = (fillPx - 6) + 'px';
  inst.meterHandle.classList.toggle('visible', fillPx > 3);

  // Bottom dot: hollow → solid when bottomed out
  inst.meterBottomDot.classList.toggle('bottomed', bottomed);

  // Numeric label — press depth as % of maxPressFrame (100% = fully bottomed)
  const pressedPct = maxF > 0 ? (thisFrame / maxF) * 100 : 0;
  inst.meterValue.textContent = Math.round(pressedPct) + '%';
}

// Returns the src of the nearest loaded frame to idx (handles null gaps in the array).
// Scans up to 8 slots in both directions — avoids showing a stale frame when footage
// has missing files (404s leave null slots and cause visible freeze-then-jump artefacts).
function nearestFrameSrc(frames, idx) {
  if (!frames) return null;
  if (frames[idx]) return frames[idx].src;
  for (let d = 1; d <= 8; d++) {
    if (idx - d >= 0          && frames[idx - d]) return frames[idx - d].src;
    if (idx + d < frames.length && frames[idx + d]) return frames[idx + d].src;
  }
  return null;
}

// ============================================================
// RENDER
// ============================================================
function renderAllPanels(d) {
  d = Math.max(0, Math.min(1, d));
  state.pressDepth = d;
  const yPct = TOP_PCT + (BOT_PCT - TOP_PCT) * d;

  // Primary family (touched panel) defines the frame scale for this gesture.
  // Other panels are clamped at their own maxPressFrame:
  //   - If primary has more frames → softer panels bottom out before d=1
  //   - If primary has fewer frames → stiffer panels haven't bottomed out at d=1
  const primaryFamily = familyById(state.primaryFamilyId) || (panels[0] && familyById(panels[0].familyId));
  const primaryMax    = primaryFamily ? primaryFamily.maxPressFrame : (TOTAL_FRAMES - 1);

  panels.forEach(inst => {
    const family = familyById(inst.familyId);
    // Frame: proportional to primary's range, clamped at this family's own maximum
    const frameIdx = Math.min(family.maxPressFrame, Math.round(d * primaryMax));

    // Placeholder darkening tracks press depth (uniform across panels)
    inst.placeholder.style.filter = `brightness(${1 - d * 0.16})`;

    // Frame image (per-family — each sofa shows a different frame at the same depth)
    if (inst.hasFrames) {
      const src = nearestFrameSrc(inst.frames, frameIdx);
      if (src) inst.frameImg.src = src;
    }

    // Indicator position (shared across panels)
    inst.indicator.style.top = yPct + '%';
    inst.hint.style.top = `calc(${yPct}% + 34px)`;

    // Meter: 3-zone update
    updateMeter(inst, frameIdx);
  });
}

function moveIndicatorOnly(d) {
  // Used in demo mode — only moves indicator, does not update frames/meter
  d = Math.max(0, Math.min(1, d));
  const yPct = TOP_PCT + (BOT_PCT - TOP_PCT) * d;
  panels.forEach(inst => {
    inst.indicator.style.top = yPct + '%';
    inst.hint.style.top = `calc(${yPct}% + 48px)`;
  });
}

// ============================================================
// DEMO LOOP
// ============================================================
function startDemo() {
  if (state.mode === 'demo') return;
  state.mode = 'demo';
  state.demoStart = null;
  panels.forEach(inst => {
    inst.indicator.classList.add('demo');
    if (!state.hasInteracted) setTimeout(() => inst.hint.classList.add('show'), 400);
  });
  state.demoRAF = requestAnimationFrame(demoTick);
}

function demoTick(now) {
  if (state.mode !== 'demo') return;
  if (!state.demoStart) state.demoStart = now;
  const t = (now - state.demoStart) % 4000;
  let d;
  if      (t < 1200) { const p = t / 1200;         d = 1 - Math.pow(1 - p, 3); }
  else if (t < 1500) {                               d = 1; }
  else if (t < 2000) { const p = (t - 1500) / 500;  d = Math.pow(1 - p, 2); }
  else               {                               d = 0; }
  moveIndicatorOnly(d);
  state.demoRAF = requestAnimationFrame(demoTick);
}

// ============================================================
// DRAG INTERACTION
// ============================================================
function computeDragRange() {
  // Match dragRangePx to the actual pixel distance the handle travels (TOP_PCT→BOT_PCT of panel height),
  // so the handle tracks the finger 1:1 instead of feeling sluggish.
  const inst = panels[0];
  const panelH = inst ? inst.videoArea.getBoundingClientRect().height : 0;
  const handleTravelPx = panelH * (BOT_PCT - TOP_PCT) / 100;
  state.dragRangePx = handleTravelPx > 50 ? handleTravelPx : Math.max(150, window.innerHeight * 0.44);
}
computeDragRange();

function startInteraction(pointerId, y, x) {
  cancelRelease();
  if (state.demoRAF) { cancelAnimationFrame(state.demoRAF); state.demoRAF = 0; }

  // Detect which panel was touched — it sets the frame scale for this interaction
  const touched = panels.find(inst => {
    const r = inst.panel.getBoundingClientRect();
    return x >= r.left && x <= r.right;
  });
  state.primaryFamilyId = touched ? touched.familyId : (panels[0] ? panels[0].familyId : null);

  computeDragRange();
  state.mode = 'interactive';
  state.activePointerId = pointerId;
  state.dragStartY = y;
  state.isDragging = true;

  state.hasInteracted = true;  // hint never shows again after first touch
  panels.forEach(inst => {
    inst.videoArea.classList.add('dragging');
    inst.indicator.classList.remove('demo');
    inst.indicator.classList.add('dragging');
    inst.hint.classList.remove('show');
  });

  renderAllPanels(0);
  try { mainArea.setPointerCapture(pointerId); } catch (e) {}
}

function moveInteraction(y) {
  if (!state.isDragging) return;
  renderAllPanels((y - state.dragStartY) / state.dragRangePx);
}

function endInteraction() {
  if (!state.isDragging) return;
  state.isDragging = false;
  state.activePointerId = null;
  panels.forEach(inst => {
    inst.videoArea.classList.remove('dragging');
    inst.indicator.classList.remove('dragging');
  });
  springRelease();
}

function cancelRelease() {
  if (state.releasingRAF) { cancelAnimationFrame(state.releasingRAF); state.releasingRAF = 0; }
}

function springRelease() {
  const releaseDepth = state.pressDepth;

  // Nothing was pressed — skip animation
  if (releaseDepth <= 0) {
    state.mode = 'idle';
    startDemo();
    return;
  }

  state.mode = 'releasing';
  const t0 = performance.now();
  const PLAYBACK_FPS = 22;
  const FRAME_MS     = 1000 / PLAYBACK_FPS;

  // Capture each panel's starting frame at the moment of release
  const primaryFamily = familyById(state.primaryFamilyId) || (panels[0] && familyById(panels[0].familyId));
  const primaryMax    = primaryFamily ? primaryFamily.maxPressFrame : (TOTAL_FRAMES - 1);
  const startFrames = panels.map(inst => {
    const family = familyById(inst.familyId);
    return Math.min(family.maxPressFrame, Math.round(releaseDepth * primaryMax));
  });

  // Per-panel direction:
  //   fully pressed (startFrame >= maxPressFrame) → play remaining frames FORWARD to family's endFrame
  //   partial press (startFrame < maxPressFrame)  → play REVERSE back to frame 0
  const directions = panels.map((inst, i) => {
    const family = familyById(inst.familyId);
    return startFrames[i] >= family.maxPressFrame ? 'forward' : 'reverse';
  });

  // Natural spring duration = forward frames from maxPressFrame → endFrame (per family).
  // Reverse animations are normalised to complete in this same number of steps,
  // so every family's "return to zero" always matches its own spring-back speed.
  const naturalDurations = panels.map(inst => {
    const family = familyById(inst.familyId);
    return family.endFrame - family.maxPressFrame; // JÄTTEBO: 12, KIVIK: 9, SÖDERHAMN: 10
  });
  const maxNatural = Math.max(...naturalDurations, 1); // governs indicator return timing

  function tick(now) {
    const framesAdv = (now - t0) / FRAME_MS;

    // Indicator retreats smoothly back to rest position over maxNatural steps
    const indicatorT = Math.min(1, framesAdv / maxNatural);
    const yPct = TOP_PCT + (BOT_PCT - TOP_PCT) * releaseDepth * (1 - indicatorT);
    panels.forEach(inst => {
      inst.indicator.style.top = yPct + '%';
      inst.hint.style.top      = `calc(${yPct}% + 48px)`;
    });

    let allDone = true;
    panels.forEach((inst, i) => {
      const family  = familyById(inst.familyId);
      const fEnd    = family.endFrame;
      const startF  = startFrames[i];
      const dir     = directions[i];
      const natDur  = naturalDurations[i];
      let frameIdx, displayFrameIdx;

      if (dir === 'forward') {
        // Play spring-back frames at natural speed; meter counts maxPressFrame → 0
        frameIdx = Math.min(fEnd, Math.round(startF + framesAdv));
        if (frameIdx < fEnd) allDone = false;
        const fwdRange = fEnd - startF;
        const fwdProg  = fwdRange > 0 ? Math.min(1, (frameIdx - startF) / fwdRange) : 1;
        // Map forward animation back to 0..maxPressFrame scale for the meter display
        displayFrameIdx = Math.round(family.maxPressFrame * (1 - fwdProg));
      } else {
        // Reverse at normalised speed so it always finishes in natDur steps
        // (matching the family's own forward spring duration → consistent feel)
        const revRate = natDur > 0 ? startF / natDur : 1;
        frameIdx        = Math.max(0, Math.round(startF - framesAdv * revRate));
        if (frameIdx > 0) allDone = false;
        displayFrameIdx = frameIdx;
      }

      inst.placeholder.style.filter = `brightness(${1 - releaseDepth * (1 - indicatorT) * 0.16})`;
      if (inst.hasFrames) { const src = nearestFrameSrc(inst.frames, frameIdx); if (src) inst.frameImg.src = src; }
      updateMeter(inst, displayFrameIdx);
    });

    if (allDone) {
      state.pressDepth   = 0;
      state.releasingRAF = 0;
      panels.forEach(inst => {
        inst.placeholder.style.filter = 'brightness(1)';
        if (inst.hasFrames) { const src = nearestFrameSrc(inst.frames, 0); if (src) inst.frameImg.src = src; }
        updateMeter(inst, 0);
      });
      state.mode = 'idle';
      startDemo();
      return;
    }

    state.releasingRAF = requestAnimationFrame(tick);
  }
  state.releasingRAF = requestAnimationFrame(tick);
}

// Pointer events on mainArea (catches all panels)
mainArea.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (state.activeOp === 'structure') {
    startPinch(e);
  } else {
    if (state.mode === 'interactive') return;
    startInteraction(e.pointerId, e.clientY, e.clientX);
  }
});
// rAF-throttle: capture the latest event, dispatch at most once per frame.
// touch-action:none on mainArea handles scroll prevention, so preventDefault
// inside the rAF callback is safe.
let _pendingMoveEvent = null;
let _moveRAFPending   = false;
mainArea.addEventListener('pointermove', e => {
  _pendingMoveEvent = e;
  if (_moveRAFPending) return;
  _moveRAFPending = true;
  requestAnimationFrame(() => {
    _moveRAFPending = false;
    const ev = _pendingMoveEvent;
    if (!ev) return;
    if (state.activeOp === 'structure') {
      movePinch(ev);
    } else if (ev.pointerId === state.activePointerId) {
      moveInteraction(ev.clientY);
    }
  });
});
mainArea.addEventListener('pointerup', e => {
  if (state.activeOp === 'structure') {
    endPinch(e);
  } else if (e.pointerId === state.activePointerId) {
    endInteraction();
  }
});
mainArea.addEventListener('pointercancel', e => {
  if (state.activeOp === 'structure') { endPinch(e); }
  else if (e.pointerId === state.activePointerId) { endInteraction(); }
});
mainArea.addEventListener('lostpointercapture', e => {
  if (state.activeOp === 'structure') { endPinch(e); return; }
  if (e.pointerId === state.activePointerId) endInteraction();
});
mainArea.addEventListener('dragstart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

// ============================================================
// PINCH / STRUCTURE GESTURE  (two-finger touch)
// ============================================================
const PINCH_SCALE = 180; // px of finger spread change = depth 1.0

function getPinchInfo() {
  const pts = [...state.gesturePointers.values()];
  if (pts.length < 2) return null;
  return {
    dx: Math.abs(pts[0].x - pts[1].x),
    dy: Math.abs(pts[0].y - pts[1].y),
  };
}

function startPinch(e) {
  state.gesturePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  try { mainArea.setPointerCapture(e.pointerId); } catch (_) {}

  if (state.gesturePointers.size === 1) {
    // Identify which panel the gesture started in — calibrates drag range + depth normalisation
    state.triggeredPanelInst = panels.find(p => {
      const r = p.panel.getBoundingClientRect();
      return e.clientX >= r.left && e.clientX < r.right;
    }) || panels[0] || null;

    state.singleDragStartX       = e.clientX;
    state.singleDragStartY       = e.clientY;
    state.singleDragAxisLocked   = false;
    state.singleDragLockedType   = null;
    state.singleDragDepthAtStart = state.gestureDepth;
    // Determine which side of the triggered panel's centre the drag started from.
    // Right side: inward = drag left (dx < 0)  → squeeze
    //             outward = drag right (dx > 0) → stretch-h
    // Left side:  inward = drag right (dx > 0) → squeeze
    //             outward = drag left (dx < 0)  → stretch-h
    const tp = state.triggeredPanelInst;
    if (tp) {
      const pr = tp.videoArea.getBoundingClientRect();
      const centreX = pr.left + pr.width / 2;
      state.singleDragStartSide = e.clientX >= centreX ? 'right' : 'left';
    } else {
      state.singleDragStartSide = 'right';
    }
    return;
  }

  if (state.gesturePointers.size === 2) {
    state.gestureInitDist  = getPinchInfo();
    state.gestureAxisLocked = false;
    state.gestureType      = null;

    stopStructureHintAnim();
    setVariantInteracted();
    panels.forEach(p => {
      p.squeezeHandleL.classList.remove('demo');
      p.squeezeHandleR.classList.remove('demo');
      p.squeezeHandleL.style.display = '';
      p.squeezeHandleR.style.display = '';
      p.squeezeHandleL.classList.add('squeezing');
      p.squeezeHandleR.classList.add('squeezing');
      p.squeezeHandleL.style.opacity = '';
      p.squeezeHandleR.style.opacity = '';
      p.squeezeWidget.classList.add('interacted');
    });
  }
}

function movePinch(e) {
  if (!state.gesturePointers.has(e.pointerId)) return;
  state.gesturePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  // ── Single-pointer drag (works anywhere on the screen) ─────────────
  if (state.gesturePointers.size === 1) {
    const dx = e.clientX - state.singleDragStartX;
    const dy = e.clientY - state.singleDragStartY;

    if (!state.singleDragAxisLocked) {
      if (Math.max(Math.abs(dx), Math.abs(dy)) >= GESTURE_THRESHOLD) {
        state.singleDragAxisLocked = true;
        if (state.structureVariant === 'hand') {
          // Hand variant: only stretch-h allowed regardless of drag direction
          state.singleDragLockedType = 'stretch-h';
        } else if (Math.abs(dx) >= Math.abs(dy)) {
          // "Inward" = moving toward the panel centre.
          // Right side: inward is dx < 0. Left side: inward is dx > 0.
          const inward = state.singleDragStartSide === 'right' ? dx < 0 : dx > 0;
          state.singleDragLockedType = inward ? 'squeeze' : 'stretch-h';
        } else {
          state.singleDragLockedType = 'stretch-v'; // either up or down → vertical
        }
        // Gesture type confirmed — stop hint, mark handles as active
        stopStructureHintAnim();
        setVariantInteracted();
        // Brief transition so handles glide to their gesture-start positions (important for
        // stretch-v which moves both handles to centre X from their resting side positions)
        panels.forEach(p => {
          const t = 'left 180ms ease, top 180ms ease';
          if (p.squeezeHandleL) p.squeezeHandleL.style.transition = t;
          if (p.squeezeHandleR) p.squeezeHandleR.style.transition = t;
          p.squeezeHandleL.classList.remove('demo');
          p.squeezeHandleR.classList.remove('demo');
          p.squeezeHandleL.style.display = '';
          p.squeezeHandleR.style.display = '';
          p.squeezeHandleL.classList.add('squeezing');
          p.squeezeHandleR.classList.add('squeezing');
          p.squeezeHandleL.style.opacity = '';
          p.squeezeHandleR.style.opacity = '';
          p.squeezeWidget.classList.add('interacted');
        });
        renderAllStructure(state.singleDragLockedType, state.singleDragDepthAtStart);
        setTimeout(() => panels.forEach(p => {
          if (p.squeezeHandleL) p.squeezeHandleL.style.transition = '';
          if (p.squeezeHandleR) p.squeezeHandleR.style.transition = '';
        }), 180);
      }
      return; // wait until axis locked
    }

    if (!state.singleDragLockedType) return;
    const firstPanel = panels[0];
    const w      = firstPanel ? (firstPanel.videoArea.offsetWidth || firstPanel.panel.offsetWidth) : 300;
    const hRange = w * (SQ_RIGHT_PCT - SQ_LEFT_PCT); // squeeze: panel-width-based scale

    // Stretch drag scale = triggered panel's full indicator width → depth 1.0
    const refCfg     = getInstIndicatorCfg(state.triggeredPanelInst || firstPanel);
    const hDragRange = refCfg.maxStretchH || 30;
    const vDragRange = refCfg.maxStretchV || 30;

    let newDepth;
    // inwardSign: the sign of dx that means "moving toward centre"
    //   right side → inward is dx < 0 → inwardSign = -1
    //   left  side → inward is dx > 0 → inwardSign = +1
    const inwardSign = state.singleDragStartSide === 'right' ? -1 : 1;
    if (state.singleDragLockedType === 'squeeze') {
      newDepth = Math.max(0, Math.min(1, state.singleDragDepthAtStart + inwardSign * dx / hRange));
    } else if (state.singleDragLockedType === 'stretch-h') {
      newDepth = Math.max(0, Math.min(1, state.singleDragDepthAtStart - inwardSign * dx / hDragRange));
    } else { // stretch-v — any vertical drag (up or down) → deeper
      newDepth = Math.max(0, Math.min(1, state.singleDragDepthAtStart + Math.abs(dy) / vDragRange));
    }
    state.gestureType = state.singleDragLockedType;
    renderAllStructure(state.singleDragLockedType, newDepth);
    return;
  }
  // ── End single-pointer ─────────────────────────────────────────────

  if (state.gesturePointers.size < 2 || !state.gestureInitDist) return;

  const cur = getPinchInfo();
  const ddx = cur.dx - state.gestureInitDist.dx; // > 0 = fingers spread horizontally
  const ddy = cur.dy - state.gestureInitDist.dy; // > 0 = fingers spread vertically

  if (!state.gestureAxisLocked) {
    if (Math.max(Math.abs(ddx), Math.abs(ddy)) >= GESTURE_THRESHOLD) {
      state.gestureAxisLocked = true;
      if (state.structureVariant === 'hand') {
        // Hand variant: only stretch-h
        state.gestureType = 'stretch-h';
      } else if (Math.abs(ddx) >= Math.abs(ddy)) {
        state.gestureType = ddx < 0 ? 'squeeze' : 'stretch-h';
      } else {
        state.gestureType = 'stretch-v';
      }
    }
    return;
  }

  // Two-finger pinch scale: triggered panel's indicator, same as single-pointer
  const pinchCfg  = getInstIndicatorCfg(state.triggeredPanelInst || (panels.length ? panels[0] : null));
  const hPinchMax = pinchCfg.maxStretchH || PINCH_SCALE;
  const vPinchMax = pinchCfg.maxStretchV || PINCH_SCALE;

  let depth;
  if (state.gestureType === 'squeeze') {
    depth = Math.max(0, Math.min(1, -ddx / PINCH_SCALE));
  } else if (state.gestureType === 'stretch-h') {
    depth = Math.max(0, Math.min(1,  ddx / hPinchMax));
  } else { // stretch-v
    depth = Math.max(0, Math.min(1,  ddy / vPinchMax));
  }
  renderAllStructure(state.gestureType, depth);
}

function endPinch(e) {
  state.gesturePointers.delete(e.pointerId);
  if (state.gesturePointers.size < 2) {
    state.gestureInitDist      = null;
    state.gestureAxisLocked    = false;
    state.singleDragAxisLocked = false;
    state.singleDragLockedType = null;
    panels.forEach(p => {
      if (p.squeezeHandleL) p.squeezeHandleL.style.transition = '';
      if (p.squeezeHandleR) p.squeezeHandleR.style.transition = '';
      p.squeezeHandleL.classList.remove('squeezing');
      p.squeezeHandleR.classList.remove('squeezing');
      // Keep 'interacted' on the widget permanently after first interaction so the
      // "Explore the structure" label stays hidden even when the hint restarts
      if (!variantInteracted()) p.squeezeWidget.classList.remove('interacted');
    });
    structureSpringBack();
  }
}

let structureSpringRAF = 0;
function structureSpringBack() {
  if (structureSpringRAF) cancelAnimationFrame(structureSpringRAF);
  const startDepth = state.gestureDepth;
  const startType  = state.gestureType;
  if (startDepth <= 0) {
    state.gestureType        = null;
    state.triggeredPanelInst = null;
    // Restart hint even if there was no spring to animate (e.g. tap without dragging)
    if (state.activeOp === 'structure') startStructureHintAnim(350);
    return;
  }

  const t0 = performance.now();
  const DURATION_MS = 380;

  function tick(now) {
    const t    = Math.min(1, (now - t0) / DURATION_MS);
    const ease = 1 - Math.pow(1 - t, 3); // ease-out cubic
    renderAllStructure(startType, startDepth * (1 - ease));
    if (t < 1) {
      structureSpringRAF = requestAnimationFrame(tick);
    } else {
      state.triggeredPanelInst = null; // clear after spring-back completes
      renderAllStructure(null, 0);
      structureSpringRAF = 0;
      // Restart the hint animation after spring-back
      if (state.activeOp === 'structure') startStructureHintAnim(350);
    }
  }
  structureSpringRAF = requestAnimationFrame(tick);
}

(function () {

// Applies structure-mode view to a single panel instance.
// Called by switchOp (for all panels) and by addPanel (for a newly added panel
// when already in structure mode so it appears correctly right away).
function initInstForStructure(inst) {
  const family = familyById(inst.familyId);

  // Show structure UI, hide press UI
  inst.indicator.style.display = 'none';
  inst.hint.style.display      = 'none';
  inst.panel.querySelector('.panel-meter').style.display = 'none';
  inst.squeezeWidget.classList.add('active');
  inst.frameImg.style.display   = 'none';
  inst.squeezeImg.style.display = (state.structureVariant === 'hand')
    ? (inst.hasStretchHandFrames ? 'block' : 'none')
    : (inst.hasSqueezeFrames    ? 'block' : 'none');

  // Load frame sequences (cache prevents re-fetch on repeat calls)
  const sc        = structureCfg(family, inst.colorKey);
  const sCacheKey = structCacheKey(family, inst.colorKey);
  if (sc.squeezeFramesDir) {
    if (!squeezeCache.has(sCacheKey)) {
      loadSqueezeFrames(inst);
    } else {
      inst.squeezeFrames    = squeezeCache.get(sCacheKey);
      inst.hasSqueezeFrames = !!inst.squeezeFrames[sc.squeezeEndFrame];
    }
  }
  if (sc.stretchHFramesDir) {
    if (!stretchHCache.has(sCacheKey)) {
      loadStretchHFrames(inst);
    } else {
      inst.stretchHFrames    = stretchHCache.get(sCacheKey);
      inst.hasStretchHFrames = !!inst.stretchHFrames[sc.stretchHEndFrame];
    }
  }
  if (sc.stretchVFramesDir) {
    if (!stretchVCache.has(sCacheKey)) {
      loadStretchVFrames(inst);
    } else {
      inst.stretchVFrames    = stretchVCache.get(sCacheKey);
      inst.hasStretchVFrames = !!inst.stretchVFrames[sc.stretchVEndFrame];
    }
  }
  // Hand variant: load stretch-with-hand frames (per-color cache key)
  const hc = handVariantCfg(family, inst.colorKey);
  if (hc.stretchHandFramesDir) {
    const hCacheKey = handCacheKey(family, inst.colorKey);
    if (!stretchHandCache.has(hCacheKey)) {
      loadStretchHandFrames(inst);
    } else {
      inst.stretchHandFrames    = stretchHandCache.get(hCacheKey);
      inst.hasStretchHandFrames = !!inst.stretchHandFrames[hc.stretchHandEndFrame];
    }
  }

  // Clear cached video area width so handles re-measure from live layout
  inst._videoAreaW = 0;
  // Render handles at rest + reset frame
  renderStructure(inst, null, 0);

  // Ensure handles carry the demo class so the hint animation picks them up
  inst.squeezeHandleL.classList.add('demo');
  inst.squeezeHandleR.classList.add('demo');

  // Re-apply interacted state (keeps label hidden if user has already interacted)
  if (variantInteracted()) inst.squeezeWidget.classList.add('interacted');
}

function switchOp(op) {
  state.activeOp = op;
  stopStructureHintAnim();

  if (op === 'structure') {
    state.gestureDepth       = 0;
    state.gestureType        = null;
    state.triggeredPanelInst = null;
    state.mode = 'idle';
    cancelRelease();
    if (state.demoRAF) { cancelAnimationFrame(state.demoRAF); state.demoRAF = 0; }
    panels.forEach(inst => initInstForStructure(inst));
    startStructureHintAnim();

  } else { // press
    state.gestureDepth = 0;
    state.gestureType  = null;
    panels.forEach(inst => {
      inst.indicator.style.display = '';
      inst.hint.style.display      = '';
      inst.panel.querySelector('.panel-meter').style.display = '';
      inst.squeezeWidget.classList.remove('active');
      inst.squeezeImg.style.display = 'none';
      inst.squeezeImg.src           = '';
      if (inst.hasFrames) inst.frameImg.style.display = 'block';
      if (inst.siZone) inst.siZone.style.opacity = '0';
    });
    renderAllPanels(0);
    startDemo();
  }
}

function navItemHTML(familyId, colorKey, idx, showOrderBtn = false) {

// Shuffle — keeps exact panel count, respects color + firmness filters, skips locked panels
document.getElementById('shuffleBtn').addEventListener('click', () => {
  const count = state.activePanels.length;
  if (!count) return;
  const filtered = filteredFamilies();
  if (!filtered.length) return;

  // Keys already occupied by locked panels (cannot be reused for unlocked slots)
  const lockedKeys = new Set(
    state.activePanels.filter(p => p.locked).map(p => p.panelKey)
  );

  // Randomly order filtered families (only used for unlocked slots)
  const shuffled = [...filtered].sort(() => Math.random() - 0.5);

  // Build combos: locked slots keep their current entry; unlocked slots get new picks
  const usedKeys = new Set(lockedKeys);
  const combos = [];
  let shuffleIdx = 0;

  for (let i = 0; i < count; i++) {
    const ap = state.activePanels[i];
    if (ap.locked) {
      combos.push({ familyId: ap.familyId, colorKey: ap.colorKey, locked: true });
      continue;
    }
    // Pick next family that produces a unique panelKey
    let picked = null;
    for (let attempt = 0; attempt < shuffled.length * 2; attempt++) {
      const family = shuffled[shuffleIdx % shuffled.length];
      shuffleIdx++;
      let colorKey = state.colorFilter
        ? (firstColorInCategory(family, state.colorFilter) || family.defaultColor)
        : ap.colorKey;
      let pKey = `${family.id}-${colorKey}`;
      if (usedKeys.has(pKey)) {
        const alt = SOFA_COLORS.find(c => !usedKeys.has(`${family.id}-${c.key}`));
        if (alt) { colorKey = alt.key; pKey = `${family.id}-${colorKey}`; }
        else continue;
      }
      usedKeys.add(pKey);
      picked = { familyId: family.id, colorKey, locked: false };
      break;
    }
    if (!picked) {
      // Fallback: keep the current unlocked panel as-is
      usedKeys.add(ap.panelKey);
      picked = { familyId: ap.familyId, colorKey: ap.colorKey, locked: false };
    }
    combos.push(picked);
  }

  rebuildPanels(combos);
});

function filteredFamilies() {
  return SOFA_FAMILIES.filter(f => {
    if (state.firmnessFilter && f.firmness !== state.firmnessFilter) return false;
    if (state.colorFilter && !familyHasCategory(f, state.colorFilter)) return false;
    return true;
  });
}

function updateFilterPills() {
  if (state.colorFilter) {
    const cat = COLOR_CATEGORIES.find(c => c.key === state.colorFilter);
    if (cat) { colorDot.style.background = cat.hex; colorLabelEl.textContent = cat.label; }
  } else {
    colorDot.style.background = '#B8A898';
    colorLabelEl.textContent  = 'all';
  }
  firmnessLabelEl.textContent = state.firmnessFilter ? FIRMNESS_LABELS[state.firmnessFilter] : 'firmness';
  document.getElementById('firmnessIcon').innerHTML = firmnessIconSVG(state.firmnessFilter || 'medium-firm', 16, 11);
}

function rebuildPanels(combos) {
  cancelRelease();
  if (state.demoRAF) { cancelAnimationFrame(state.demoRAF); state.demoRAF = 0; }
  panels.forEach(p => p.panel.remove());
  panels.length = 0;
  state.activePanels = [];
  state.mode = 'idle';
  // Deduplicate combos by panelKey before adding (safety net)
  const seen = new Set();
  const unique = combos.filter(c => {
    const k = panelKey(c.familyId, c.colorKey);
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });
  unique.forEach(c => {
    addPanel(c.familyId, c.colorKey);
    // Restore locked state if this combo was locked
    if (c.locked) {
      const inst = panels.find(p => p.panelKey === panelKey(c.familyId, c.colorKey));
      if (inst) setLocked(inst, true);
    }
  });
  renderAllPanels(0);
  startDemo();
}

// ADD MODAL — select family + color independently
// ============================================================
let modalSelectedFamilyId = null;
let modalSelectedCategory  = null;  // broad category key — active when no family is selected yet
let modalSelectedColorKey  = null;  // specific cover key — active once a family is selected

addBtn.addEventListener('click', () => openAddModal());
modalCancel.addEventListener('click', closeAddModal);

function openAddModal() {
  modalSelectedFamilyId = null;
  modalSelectedCategory  = null;
  modalSelectedColorKey  = null;
  renderAddModal();
  addModal.classList.add('open');
}
function closeAddModal() {
  addModal.classList.remove('open');
  modalSelectedFamilyId = null;
  modalSelectedCategory  = null;
  modalSelectedColorKey  = null;
}

function renderAddModal() {
  const fSel       = modalSelectedFamilyId;
  const selFamily  = fSel ? familyById(fSel) : null;
  const familyMode = fSel !== null;   // true once a family has been tapped

  // canAdd: family + colour selected, AND that exact combination not already in comparison
  const alreadyAdded = fSel !== null && modalSelectedColorKey !== null &&
    state.activePanels.some(p => p.panelKey === panelKey(fSel, modalSelectedColorKey));
  const canAdd = familyMode && modalSelectedColorKey !== null && !alreadyAdded;

  let html = `<div class="modal-main-title">Add to comparison</div>`;

  // — Section 1: Sofa Family —
  // In category mode: filter families by selected category (bidirectional)
  // In family mode: show all families so user can still switch
  const visibleFamilies = (!familyMode && modalSelectedCategory)
    ? SOFA_FAMILIES.filter(f => familyHasCategory(f, modalSelectedCategory))
    : SOFA_FAMILIES;
  const onDisp  = visibleFamilies.filter(f =>  f.onDisplay);
  const offDisp = visibleFamilies.filter(f => !f.onDisplay);

  if (onDisp.length) {
    html += `<div class="modal-section">On-display, ready to try out</div>
             <div class="modal-sofa-grid">`;
    onDisp.forEach(f => { html += sofaCardHTML(f, f.id === fSel); });
    html += `</div>`;
  }
  if (offDisp.length) {
    html += `<div class="modal-section">Not on-display, explore digitally first!</div>
             <div class="modal-sofa-grid">`;
    offDisp.forEach(f => { html += sofaCardHTML(f, f.id === fSel); });
    html += `</div>`;
  }
  if (!onDisp.length && !offDisp.length) {
    html += `<div class="modal-section" style="color:#aaa;font-style:italic">No families available in this colour</div>`;
  }

  html += `<div class="modal-divider"></div>
           <div class="modal-section">Choose cover colour</div>`;

  if (familyMode) {
    // — Family mode: show each specific cover colour for the selected family —
    const colorList = (selFamily.availableColors || [])
      .map(k => SOFA_COLORS.find(c => c.key === k)).filter(Boolean);

    html += `<div class="modal-spec-grid">`;
    colorList.forEach(c => {
      const sel        = c.key === modalSelectedColorKey ? 'sel' : '';
      const whiteClass = c.category === 'white' ? 'white-dot' : '';
      html += `<div class="modal-spec-item" data-color-key="${c.key}">
                 <div class="modal-spec-dot ${sel} ${whiteClass}" style="background:${c.hex}"></div>
                 <span class="modal-spec-name">${c.label}</span>
               </div>`;
    });
    html += `</div>`;

  } else {
    // — Category mode: show 12 broad colour category dots —
    html += `<div class="modal-cat-grid">`;
    COLOR_CATEGORIES.forEach(cat => {
      const sel        = cat.key === modalSelectedCategory ? 'sel' : '';
      const whiteClass = cat.key === 'white' ? 'white-dot' : '';
      html += `<div class="modal-cat-item" data-cat-key="${cat.key}">
                 <div class="modal-cat-dot ${sel} ${whiteClass}" style="background:${cat.hex}"></div>
                 <span class="modal-cat-name">${cat.label}</span>
               </div>`;
    });
    html += `</div>`;
  }

  // Add button
  html += `<button class="modal-add-btn" id="modalAddBtn" ${canAdd ? '' : 'disabled'}>
             ${alreadyAdded ? 'Already in comparison' : 'Add to comparison'}
           </button>`;

  modalBody.innerHTML = html;

  // — Family card clicks —
  // Auto-select the recorded/default colour so the Add button is immediately active
  modalBody.querySelectorAll('.modal-sofa-card').forEach(card => {
    card.addEventListener('click', () => {
      const id = parseInt(card.dataset.sofaId);
      const f  = familyById(id);
      modalSelectedFamilyId = id;
      // Pre-select the colour that has actual footage (or the default if none)
      modalSelectedColorKey = f.recordedColorKey || f.defaultColor || null;
      renderAddModal();
    });
  });

  // — Category dot clicks (category mode only) —
  // Selecting a category filters the family list; toggling the same category deselects
  modalBody.querySelectorAll('.modal-cat-item').forEach(item => {
    item.addEventListener('click', () => {
      const cat = item.dataset.catKey;
      modalSelectedCategory = modalSelectedCategory === cat ? null : cat;
      renderAddModal();
    });
  });

  // — Specific-colour clicks (family mode only) —
  modalBody.querySelectorAll('.modal-spec-item').forEach(item => {
    item.addEventListener('click', () => {
      modalSelectedColorKey = item.dataset.colorKey;
      renderAddModal();
    });
  });

  // — Add button —
  const addBtnEl = document.getElementById('modalAddBtn');
  if (addBtnEl && canAdd) {
    addBtnEl.addEventListener('click', () => {
      addPanel(modalSelectedFamilyId, modalSelectedColorKey);
      closeAddModal();
    });
  }
}

// ── canvas spotlight helpers ──────────────────────────────────
var _holes = []; // [{left,top,width,height,radius}]

function rectToHole(r, pad, radius) {
  if (!r) return null;
  var p = pad || 0;
  var left = (r.left !== undefined ? r.left : r.x || 0) - p;
  var top  = (r.top  !== undefined ? r.top  : r.y || 0) - p;
  var w    = (r.width  || (r.right - r.left)) + p * 2;
  var h    = (r.height || (r.bottom - r.top))  + p * 2;
  return { left: left, top: top, width: w, height: h, radius: radius || '12px' };
}

function parseRadius(radius, w, h) {
  if (!radius || radius === '12px') return 12;
  if (radius === '50%') return Math.min(w, h) / 2;
  if (radius === '999px') return Math.min(w, h) / 2; // pill
  return parseFloat(radius) || 12;
}

function drawRoundRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x,     y + h, x,     y + h - r, r);
  ctx.lineTo(x,     y + r);
  ctx.arcTo(x,     y,     x + r, y,         r);
  ctx.closePath();
}

function drawCanvas() {
  var W = window.innerWidth, H = window.innerHeight;
  tutCanvas.width  = W;
  tutCanvas.height = H;
  var ctx = tutCanvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  if (!_holes.length) return;
  // draw dark overlay
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(0, 0, W, H);
  // punch holes
  ctx.globalCompositeOperation = 'destination-out';
  _holes.forEach(function(hole) {
    if (!hole) return;
    var r = parseRadius(hole.radius, hole.width, hole.height);
    drawRoundRect(ctx, hole.left, hole.top, hole.width, hole.height, r);
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.fill();
  });
  ctx.globalCompositeOperation = 'source-over';
}

function showOverlay() {
  overlay.classList.add('active');
  tutCanvas.style.display = 'block';
}
function hideOverlay() {
  overlay.classList.remove('active');
  tutCanvas.style.display = 'none';
  _holes = [];
}

function spotlight(s) {
  cancelPulse();
  var el1 = s.target  ? s.target()  : null;
  var el2 = s.target2 ? s.target2() : null;
  var r1 = el1 ? (typeof el1.getBoundingClientRect === 'function' ? el1.getBoundingClientRect() : el1) : null;
  var r2 = el2 ? (typeof el2.getBoundingClientRect === 'function' ? el2.getBoundingClientRect() : el2) : null;
  if (s.isDual && r2) {
    _holes = [
      rectToHole(r1, s.pad,        s.radius              || '12px'),
      rectToHole(r2, s.pad2 || 8,  s.radius2 || s.radius || '12px'),
    ];
  } else {
    _holes = [ rectToHole(r1, s.pad, s.radius) ];
  }
  drawCanvas();
}

function clearSpotlight() {
  cancelPulse();
  _holes = [];
  drawCanvas();
}

// ── meter pulse (step 4) ──────────────────────────────────────
var _rafId = null;

function cancelPulse() {
  if (_pulseTimer) { clearTimeout(_pulseTimer); _pulseTimer = null; }
  if (_rafId) { cancelAnimationFrame(_rafId); _rafId = null; }
}

function drawCanvasWithRing(hole, ringProgress) {
  // ringProgress 0→1: ring expands outward and fades
  var W = window.innerWidth, H = window.innerHeight;
  tutCanvas.width = W; tutCanvas.height = H;
  var ctx = tutCanvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  // dark overlay
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(0, 0, W, H);
  // punch hole
  ctx.globalCompositeOperation = 'destination-out';
  var r = parseRadius(hole.radius, hole.width, hole.height);
  drawRoundRect(ctx, hole.left, hole.top, hole.width, hole.height, r);
  ctx.fillStyle = 'rgba(0,0,0,1)';
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
  // pulsing ring: expand by up to 14px, fade from 0.7→0
  var expand = ringProgress * 14;
  var alpha  = (1 - ringProgress) * 0.7;
  if (alpha > 0) {
    var rx = hole.left   - expand;
    var ry = hole.top    - expand;
    var rw = hole.width  + expand * 2;
    var rh = hole.height + expand * 2;
    var rr = parseRadius(hole.radius, rw, rh) + expand;
    ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
    ctx.lineWidth   = 2.5;
    drawRoundRect(ctx, rx, ry, rw, rh, rr);
    ctx.stroke();
  }
}

function lerpHole(a, b, t) {
  // ease in-out cubic
  var e = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
  return {
    left:   a.left   + (b.left   - a.left)   * e,

function drawCanvasHole(hole) {
  var W = window.innerWidth, H = window.innerHeight;
  tutCanvas.width = W; tutCanvas.height = H;
  var ctx = tutCanvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(0,0,0,0.62)';
  ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'destination-out';
  var r = parseRadius(hole.radius, hole.width, hole.height);
  drawRoundRect(ctx, hole.left, hole.top, hole.width, hole.height, r);
  ctx.fillStyle = 'rgba(0,0,0,1)';
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

function runMeterPulse() {
  cancelPulse();
  var morphDur  = 420;  // whole → dash morph
  var pulseDur  = 1400; // dash phase with pulse
  var cycleDur  = 700;  // pulse ring cycle

  function getWholeHole() {
    var meter = kivikEl('.panel-meter');
    return meter ? rectToHole(meter.getBoundingClientRect(), 10, '999px') : null;
  }
  function getDashHole() {
    var dash = kivikEl('.meter-z2'), meter = kivikEl('.panel-meter');
    if (!dash || !meter) return null;
    var mR = meter.getBoundingClientRect(), dR = dash.getBoundingClientRect();
    return rectToHole({ left: mR.left, top: dR.top, width: mR.width, height: dR.height }, 8, '999px');
  }

  function phaseWhole() {
    var h = getWholeHole();
    if (h) { _holes = [h]; drawCanvas(); }
    _pulseTimer = setTimeout(phaseMorph, 1600);
  }

  function phaseMorph() {
    var fromHole = getWholeHole();
    var toHole   = getDashHole();
    if (!fromHole || !toHole) { phaseDash(); return; }
    var start = null;
    function tick(ts) {
      if (!start) start = ts;
      var t = Math.min((ts - start) / morphDur, 1);
      drawCanvasHole(lerpHole(fromHole, toHole, t));
      if (t < 1) { _rafId = requestAnimationFrame(tick); }
      else { _rafId = null; phaseDash(); }
    }
    _rafId = requestAnimationFrame(tick);
  }

  function phaseMorphBack() {
    var fromHole = getDashHole();
    var toHole   = getWholeHole();
    if (!fromHole || !toHole) { phaseWhole(); return; }
    var start = null;
    function tick(ts) {
      if (!start) start = ts;
      var t = Math.min((ts - start) / morphDur, 1);
      drawCanvasHole(lerpHole(fromHole, toHole, t));
      if (t < 1) { _rafId = requestAnimationFrame(tick); }
      else { _rafId = null; phaseWhole(); }
    }
    _rafId = requestAnimationFrame(tick);
  }

  function phaseDash() {
    var hole = getDashHole();
    if (!hole) { _pulseTimer = setTimeout(phaseWhole, pulseDur); return; }
    var start = null;
    function tick(ts) {
      if (!start) start = ts;
      var elapsed = ts - start;
      if (elapsed >= pulseDur) { _holes = [hole]; drawCanvas(); return; }
      var progress = (elapsed % cycleDur) / cycleDur;
      drawCanvasWithRing(hole, progress);
      _rafId = requestAnimationFrame(tick);
    }
    _rafId = requestAnimationFrame(tick);
    _pulseTimer = setTimeout(function() {
      cancelAnimationFrame(_rafId); _rafId = null;
      phaseMorphBack();
    }, pulseDur);
  }

  phaseWhole();
}

// ── dots ─────────────────────────────────────────────────────

  dotsEl.innerHTML = '';
  STEPS.forEach(function(_, i) {
    var d = document.createElement('span');
    d.className = 'tut-dot' + (i === active ? ' active' : '');
    d.addEventListener('click', function() { goTo(i); });
    dotsEl.appendChild(d);
  });
}

// ── navigate ─────────────────────────────────────────────────
function goTo(n) {
  n = Math.max(0, Math.min(STEPS.length - 1, n));
  var prev = _step;
  _step = n;
  var s = STEPS[_step];

  textEl.innerHTML = s.text;
  renderDots(_step);
  titleEl.textContent = 'Tutorial  ' + (_step + 1) + ' / ' + STEPS.length;

  _restoreHints();

  backBtn.disabled = (_step === 0);

  if (s.isLast) {
    nextBtn.textContent = 'Start!';
    nextBtn.classList.add('start-btn');
  } else {
    nextBtn.textContent = '→';
    nextBtn.classList.remove('start-btn');
  }

  // onLeave: fire when departing a step, then onEnter for new step
  var prevStep = STEPS[prev];
  if (prevStep && prevStep.onLeave && prev !== n) prevStep.onLeave();
  if (s.onEnter) s.onEnter();

  // Spotlight after one rAF so the DOM has updated from onEnter (e.g. mode switch)
  // Steps with manualSpotlight manage their own _holes — skip auto spotlight
  if (!s.manualSpotlight) requestAnimationFrame(function() { spotlight(s); });

  if (!lh || !rh) return null;
  var lR = lh.getBoundingClientRect(), rR = rh.getBoundingClientRect();
  var left   = Math.min(lR.left,   rR.left)   - pad;
  var top    = Math.min(lR.top,    rR.top)    - pad;
  var right  = Math.max(lR.right,  rR.right)  + pad;
  var bottom = Math.max(lR.bottom, rR.bottom) + pad;
  return { left: left, top: top, width: right - left, height: bottom - top, radius: '999px' };
}

  _stopStructureSpotlight();

  document.querySelectorAll('#panelsContainer .squeeze-label').forEach(function(el) {
    el._tutParent   = el.parentNode;
    el._tutNext     = el.nextSibling;
    el._tutOldStyle = el.getAttribute('style') || '';
    el.style.cssText = 'position:fixed;z-index:900;margin:0;pointer-events:none;left:0;top:0;transform:none;transition:none;opacity:inherit';
    document.body.appendChild(el);
  });

  function tick() {
    // JÄTTEBO: first panel's handles
    var firstPanel = document.querySelector('#panelsContainer .sofa-panel:first-child');
    var lh1 = firstPanel && firstPanel.querySelector('.squeeze-handle-left');
    var rh1 = firstPanel && firstPanel.querySelector('.squeeze-handle-right');
    // KIVIK: tutorial panel's handles
    var rb  = _tutKivikKey && document.querySelector('.remove-btn[data-panel-key="' + _tutKivikKey + '"]');
    var kp  = rb && rb.closest('.sofa-panel');
    var lh2 = kp && kp.querySelector('.squeeze-handle-left');
    var rh2 = kp && kp.querySelector('.squeeze-handle-right');

    var h1 = _handlesHole(lh1, rh1, 12);

    _holes = h2 ? [h1, h2] : (h1 ? [h1] : []);
    drawCanvas();

    // Track each squeeze-label below its panel's handles hole
    document.querySelectorAll('body > .squeeze-label').forEach(function(el) {
      // find which panel this label belongs to by matching its original parent's panel
      var panel = el._tutParent && el._tutParent.closest('.sofa-panel');

      var cx      = (Math.min(lR.left, rR.left) + Math.max(lR.right, rR.right)) / 2;
      var bottom  = Math.max(lR.bottom, rR.bottom);
      el.style.left = (cx - el.offsetWidth / 2) + 'px';

  }

}

  if (_structureRafId) { cancelAnimationFrame(_structureRafId); _structureRafId = null; }
  // Restore squeeze-label elements to their original panels
  document.querySelectorAll('body > .squeeze-label').forEach(function(el) {
    if (el._tutParent) {
      el._tutParent.insertBefore(el, el._tutNext || null);
      el.setAttribute('style', el._tutOldStyle);
      el._tutParent = el._tutNext = el._tutOldStyle = null;
    }
  });
}

function _restoreHints() {
  document.querySelectorAll('body > .drag-hint').forEach(function(el) {
    el._tutTracking = false;
    if (el._tutParent) {
      el._tutParent.insertBefore(el, el._tutNext || null);
      el.setAttribute('style', el._tutOldStyle);
      el._tutParent = el._tutNext = el._tutOldStyle = null;

  });

  hideOverlay();
